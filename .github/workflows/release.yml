name: release

# Build easystream.exe (UIA / WGC / Media Foundation / SendInput), run its tests
# on Windows, and attach the binaries to the GitHub Release for the pushed tag.
#
# NATIVE WINDOWS RUNNERS, NOT CROSS-COMPILATION.
#
# The PE used to be cross-compiled from Linux with mingw, which brought a chain of
# problems that existed only because the build was pretending to be Windows:
#
#   * libopus had to be CROSS-BUILT for mingw (build.rs compiles src/opusshim.cpp
#     and links `static=opus`), and Debian's libopus-dev is an amd64 package,
#     useless for a PE target;
#   * FORTIFY had to be disabled (-D_FORTIFY_SOURCE=0) because mingw's string.h
#     redirects memcpy to __memcpy_chk, which its CRT does not implement;
#   * the unit tests could not run at all — they drive real Windows APIs and a real
#     desktop — so the step was downgraded to `cargo check`, which proves nothing
#     about behaviour.
#
# On windows-latest all of that disappears and `cargo test` genuinely runs.
#
# The `windows` crate generates its bindings at compile time, so no Visual Studio
# SDK is needed — only the Rust toolchain.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build assets for"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest,  arch: amd64 }
          # windows-11-arm is a native arm64 Windows runner.
          - { runner: windows-11-arm,  arch: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}

      # MSVC must be on the environment or build.rs cannot compile its C++ shim:
      #
      #   error: failed to run custom build command for `easystream`
      #   VCINSTALLDIR = None
      #   WindowsSdkDir = None
      #
      # A windows-latest runner HAS Visual Studio installed, but its variables are
      # not exported until vcvars is run — which is what this action does.
      - name: set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}

      # vcpkg supplies libopus for the native target — no cross build needed.
      - name: libopus
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          # The triplet follows the target: x64 for amd64, arm64 for arm64.
          $triplet = if ("${{ matrix.arch }}" -eq "arm64") { "arm64-windows-static-md" } else { "x64-windows-static-md" }
          & "$vcpkg\vcpkg.exe" install "opus:$triplet"
          echo "VCPKGRS_TRIPLET=$triplet" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "PKG_CONFIG_PATH=$vcpkg\installed\$triplet\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "installed opus:$triplet"

      # The SPA lives in another repository and build.rs inlines it.
      - name: fetch the shared web UI
        shell: bash
        run: bash build-webui.sh

      # Native: the tests really execute here.
      - name: test
        run: cargo test --release

      - name: build
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release
          out="easystream-windows-${{ matrix.arch }}.exe"
          # $RUNNER_TEMP, not /tmp: on a Windows runner /tmp is not the temp dir
          # the upload step looks in, and a hard-coded Unix path silently produced
          # an empty artifact.
          mkdir -p "$RUNNER_TEMP/out"
          cp target/release/easystream.exe "$RUNNER_TEMP/out/$out"
          ls -l "$RUNNER_TEMP/out/$out"
          # A PE starts with "MZ"; catching a non-PE here is cheaper than
          # discovering it inside the guest.
          head -c 2 "$RUNNER_TEMP/out/$out" | od -An -tx1 | grep -q '4d 5a' \
            || { echo "::error::$out is not a PE"; exit 1; }
          echo "ARTIFACT=$out" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: ${{ runner.temp }}/out/easystream-windows-*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/assets
          merge-multiple: true
      - run: ls -l /tmp/assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: /tmp/assets/easystream-windows-*
          fail_on_unmatched_files: true
          generate_release_notes: false
