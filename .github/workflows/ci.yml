name: ci

# Check every push and pull request: build and test the crate.
#
# release.yml is tag-only, so until now a push to main ran NOTHING. A change that
# broke the build sat there until someone cut a release and watched it fail.
#
# This is deliberately the same steps as release.yml's build job — the point is
# that the release and the pre-release check compile the same code the same way,
# so a green PR really does predict a green release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # WINDOWS RUNNER, not ubuntu.
    #
    # This job was copied from the Linux repo and kept its ubuntu-latest runner
    # and its apt list (libpipewire, libxcb, libwayland), none of which this crate
    # uses. Its sources live in src/uia.rs and src/win.rs and call the `windows`
    # crate, which is a cfg(windows) dependency: on a Linux runner that crate is
    # simply absent, so `cargo check` failed with thirteen "cannot find module or
    # crate `windows`" errors. It had been red since it was added, which defeats
    # the whole point of a pre-release check.
    #
    # release.yml already builds on windows-latest; this now matches it, so a
    # green push really does predict a green release.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # The SPA is fetched, not vendored, and build.rs inlines it.
      - name: fetch the shared web UI
        run: bash build-webui.sh

      # fmt is advisory for the same reason: reformatting the tree is a separate
      # change from whatever the PR is about.
      - run: cargo fmt --all -- --check
        continue-on-error: true

      # Not -D warnings: the crates carry existing warnings, and failing on them here
      # would make the first CI run red for reasons nobody just introduced.
      # MSVC must be on the environment or build.rs cannot compile its C++ shim.
      - uses: ilammy/msvc-dev-cmd@v1

      - run: cargo clippy --all-targets

      - run: cargo test --release
